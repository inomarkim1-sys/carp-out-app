workflows:
  default-workflow:
    name: CarpOut Android Build
    max_build_duration: 10
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    triggering:
      events:
        - push
        scripts:
      - name: Upgrade Android Embedding
        script: flutter create . --platforms=android
      - name: Flutter build APK
        script: flutter build apk --release
