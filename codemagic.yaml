workflows:
  default-workflow:
    name: CarpOut Android Build
    max_build_duration: 10
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    triggering:
      events:
        - push
    scripts:
      - name: Автоматическая генерация структуры Android
        script: |
          flutter create . --platforms=android
      - name: Сборка mobile APK (Релиз)
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
