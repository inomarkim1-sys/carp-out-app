workflows:
  default-workflow:
    name: CarpOut Android Build
    max_build_duration: 10
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    triggering:
      events:
        - push
    scripts:
      - name: Автоматическая генерация структуры Android
        script: |
          flutter create . --platforms=android
      - name: Принудительное обновление Android SDK до версии 34
        script: |
          sed -i 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/targetSdk = .*/targetSdk = 34/g' android/app/build.gradle
      - name: Сборка мобильного приложения APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
